[project]
name = "kaggle-data-analysis"
version = "0.1.0"
description = ""
authors = [{ name = "uowol", email = "alllhvhla@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2.3,<3",
    "numpy==2.1.0",
    "matplotlib>=3.10.0,<4",
    "seaborn>=0.13.2,<0.14",
    "requests>=2.32.3,<3",
    "ipykernel>=6.29.5,<7",
    "black>=24.10.0,<25",
    "isort>=5.13.2,<6",
    "kaggle>=2.0.0,<3",
    "setuptools>=75.8.0,<76",
    "pyaml>=25.1.0,<26",
    "pydantic>=2.10.6,<3",
    "ydata-profiling>=4.12.2,<5",
    "statsmodels>=0.14.4,<0.15",
    "scikit-learn>=1.6.0,<2",
    "pytest>=8.4.0,<9",
    "rich>=13.0.0,<14",
]


[tool.black]
line-length = 88
target-version = ['py312']
skip-string-normalization = false


[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
known_third_party = ["numpy", "pandas", "seaborn", "scikit-learn"]


[tool.pytest.ini_options]
pythonpath = ["kaggle_projects"]
addopts = "--import-mode=importlib"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kaggle_projects"]
